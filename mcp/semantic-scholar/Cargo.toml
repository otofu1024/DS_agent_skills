[package]
name = "ds-semantic-scholar-mcp"
version = "0.1.0"
edition = "2024"
description = "Semantic Scholar Academic Graph MCP server"

[[bin]]
name = "ds-semantic-scholar-mcp"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
tokio = { version = "1.54.1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
